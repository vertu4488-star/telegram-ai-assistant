version: "3.8"

services:
  telegram-ai-assistant:
    build: .
    container_name: telegram_ai_assistant
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist SQLite database file across container updates
      - ./bot.db:/app/bot.db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
