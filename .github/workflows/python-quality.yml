name: Telegram bot Python checks
on:
  pull_request:
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'scripts/migrate_sqlite_to_neon.py'
      - '.github/workflows/python-quality.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'scripts/migrate_sqlite_to_neon.py'
      - '.github/workflows/python-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check Python syntax without contacting production services
        run: python -m compileall -q app scripts
      - name: Test SQLite backup utility without connecting to real databases
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory() as folder:
              source = Path(folder) / "bot.db"
              backup = Path(folder) / "bot.backup.db"
              with sqlite3.connect(source) as db:
                  db.execute("CREATE TABLE users (id INTEGER PRIMARY KEY, telegram_id INTEGER, username TEXT, first_name TEXT, last_name TEXT, language_code TEXT, created_at TEXT, updated_at TEXT)")
                  db.execute("CREATE TABLE messages (id INTEGER PRIMARY KEY, telegram_id INTEGER, role TEXT, content TEXT, created_at TEXT)")
                  db.execute("CREATE TABLE published_news (id INTEGER PRIMARY KEY, slot_key TEXT, source_url TEXT, title TEXT, source_name TEXT, published_at TEXT, is_evergreen INTEGER)")
                  db.execute("INSERT INTO users VALUES (1, 123, 'test', 'Test', NULL, 'ru', '2026-11-07 00:00:00', '2026-11-07 00:00:00')")
              subprocess.run([sys.executable, "scripts/migrate_sqlite_to_neon.py",
                              str(source), "--backup-out", str(backup), "--dry-run"], check=True)
              assert backup.exists() and backup.stat().st_size > 0
              with sqlite3.connect(backup) as check:
                  assert check.execute("SELECT count(*) FROM users").fetchone()[0] == 1
              attempt = subprocess.run(
                  [sys.executable, "scripts/migrate_sqlite_to_neon.py",
                   str(source), "--backup-out", str(backup), "--dry-run"],
                  capture_output=True
              )
              assert attempt.returncode != 0, "Backup unexpectedly overwrote existing file"
          print("Bot backup integrity and overwrite guard passed")
          PY
      - name: Install production dependencies to catch packaging and import failures
        run: python -m pip install -r requirements.txt
      - name: Smoke-import production ASGI app without starting Telegram or contacting the database
        run: |
          python - <<'PY'
          from app.webhook import app
          paths = {route.path for route in app.routes}
          essential = {"/health", "/telegram/webhook", "/news/publish-next", "/internal/crm/health"}
          missing = essential - paths
          assert not missing, f"Missing production routes: {sorted(missing)}"
          print("Production FastAPI entrypoint and required routes imported successfully")
          PY
      - name: Assert public API security defaults without production credentials
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.webhook import app
          from app.config import Settings
          with TestClient(app) as client:
              for endpoint in ('/openapi.json', '/docs', '/redoc'):
                  assert client.get(endpoint).status_code == 404, endpoint
              root = client.get('/')
              assert root.status_code == 200
              assert root.headers['x-content-type-options'] == 'nosniff'
              assert root.headers['x-frame-options'] == 'DENY'
              assert root.headers['cache-control'] == 'no-store'
              # No Telegram header, no CRM bridge secret and no news secret:
              # privileged endpoints must fail closed before touching network APIs.
              assert client.post('/telegram/webhook', json={}).status_code == 403
              assert client.post('/news/publish-next', json={}).status_code == 403
              assert client.get('/internal/crm/health').status_code == 403
          cfg = Settings(TELEGRAM_BOT_TOKEN='telegram-secret-do-not-log',
                         GEMINI_API_KEY='gemini-secret-do-not-log',
                         DATABASE_URL='postgresql+asyncpg://user:password-do-not-log@example.com/db')
          safe = repr(cfg)
          for private in ('telegram-secret-do-not-log','gemini-secret-do-not-log',
                          'password-do-not-log','user:'):
              assert private not in safe, 'Secret appeared in Settings repr'
          print('Telegram API security defaults and secret-safe diagnostics verified')
          PY
      - name: Ensure rate limiter does not block unrelated users
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path("app/bot/middlewares.py").read_text(encoding="utf-8"))
          shared_locks = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.AsyncWith)
              and any(
                  isinstance(child, ast.Attribute) and child.attr == "_lock"
                  for item in node.items
                  for child in ast.walk(item.context_expr)
              )
          ]
          assert shared_locks, "Shared limiter lock was removed or renamed; review CI safety check"
          for node in shared_locks:
              if any(
                  isinstance(child, ast.Await)
                  for statement in node.body for child in ast.walk(statement)
              ):
                  raise AssertionError("Network or other awaits under the shared limiter lock can stall all users")
          print("Telegram rate limiter lock safety: OK")
          PY
      - name: Check webhook startup invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('app/webhook.py').read_text(encoding='utf-8')
          assert 'TELEGRAM_WEBHOOK_SECRET' in source, 'Telegram webhook secret is missing'
          assert 'hmac.compare_digest' in source, 'Webhook authentication must use constant-time compare'
          assert 'Scheduled publishing is handled only by the dedicated Render Cron Job' in source
          print('Static webhook startup protections verified')
          PY
